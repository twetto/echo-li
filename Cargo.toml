[workspace]
resolver = "2"

members = [
    "echo-li-cli",
    "echo-lie",
    "echo-li-core",
]

[workspace.dependencies]
echo-lie = { path = "echo-lie" }
rudolf-v = { git = "https://github.com/twetto/Rudolf-V" }
nalgebra = "0.33"
approx = "0.5"
rand = "0.9"
rand_distr = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
rayon = "1.10"
image = "0.25"
csv = "1.3"
spade = "2.9"
clap = { version = "4.5", features = ["derive"] }
rerun = { version = "0.31", features = ["sdk"] }
anyhow = "1.0"
