RudolfV:
  # Legacy bool (true => global histeq) — overridden by `histeq` when set.
  equaliseImageHistogram: true
  # histeq: none | global | clahe. CLAHE knobs below apply to "clahe" only.
  # histeq: clahe
  # claheTileSize: 256     # tile size in pixels
  # claheClipLimit: 4.0
  # useFastFeatures: false
  # featureDist: 64.0
  featureDist: 16.0
  featureSearchThreshold: 0.8
  fastThreshold: 20
  # Corner detector: fast (default) | harris | shi_tomasi
  detector: shi_tomasi
  # shiTomasiThreshold: 0.0      # min-eigenvalue floor (NMS/top-N pick the rest)
  # shiTomasiBlockSize: 3        # structure-tensor block size
  # maxError: 50.0
  # maxFeatures: 40  # LK tracker pool (feeds sparse_vog). EqF cap is --max-features.
  # maxFeatures: 1410
  maxFeatures: 300
  maxLevel: 3
  lbpPolicy: HardReject
  # lbpPolicy: SoftPenalty  # tested: +7cm ATE regression on V1_03 vs HardReject
  # kltResidual: feed the level-0 photometric residual into the reservoir
  # quality term (otherwise klt_quality is a dead constant 1.0). Off: on V1_03
  # the raw (unnormalized) residual is a weak, texture-confounded discriminator
  # (RPE corr -0.14) and hurt the near-end wobble. Kept wired for later (needs
  # NCC/gradient-energy normalization to be useful).
  kltResidual: false
  # minHarrisQuality: 0.05
  # enableRansac: frontend essential-matrix geometric verification. Tested off
  # on V1_03 — ATE got WORSE (28.4->33.0 cm) and it was only ~10 rejects/frame,
  # not the churn bulk. Hard outlier rejection helps ATE; keep on.
  enableRansac: true
  # Pose-prior epipolar gate: squared-Sampson threshold in normalized coords
  # (like ransacParams.inlierThreshold; 1e-5 ~ 1.45 px). Gates tracks against
  # the EqF's IMU-predicted essential matrix, replacing RANSAC on frames with a
  # prior. V1_03: ATE 21.2 -> 18.1 cm, scale drift 3.4% -> 0.7%, outlier tail
  # 11.8% -> 5.2%. Set 0 to disable.
  epipolarGateThreshold: 1.0e-5
  # epipolarRefine: guarded eight-point refit of the prior gate. Measured
  # slightly WORSE (tail 5.9% vs 5.2%); keep off.
  epipolarRefine: false
  ransacParams:
    inlierThreshold: 0.00001
    maxIterations: 200
    minDataPoints: 5
    minInliers: 15
  trackedFeatureDist: 16.0
  # trackedFeatureDist: 64.0
  # winSize: 21
eqf:
  maxFeatures: 40           # core EqF landmark cap
  initialValue:
    sceneDepth: 3.0
  initialVariance:
    attitude: 0.13565029126052572
    biasAcc: 1.5813333765300104
    biasGyr: 97162.79515771076
    cameraAttitude: 0.0010228558965517584
    cameraPosition: 0.023501400846134893
    point: 129.90415638150924
    position: 0.1
    # velocity: 8.974852995731e-08  # asserts v=0 (std 0.3 mm/s); only valid
    # with a certified-stationary start. Loose value tolerates moving starts.
    velocity: 1.0
  measurementNoise:
    feature: 2.0
    featureOutlierAbs: 10.0
    featureOutlierProb: 0.03229809583062128
    featureRetention: 0.18594708334486176
  processVariance:
    attitude: 6.025875320811407e-05
    biasAcc: 0.0
    biasGyr: 0.0
    cameraAttitude: 5.075382174045239e-06
    cameraPosition: 1.2188313140115635e-05
    point: 0.00029845436136043135
    position: 9.981466095928483e-06
    velocity: 0.025317333863551263
  settings:
    # coordinateChoice: Euclidean
    # coordinateChoice: InvDepth
    coordinateChoice: Normal   # aka Polar (sphere-normal bearing + log-depth)
    # fastRiccati: true
    fastRiccati: false
    useDiscreteInnovationLift: false
    # useDiscreteInnovationLift: true
    # useDiscreteVelocityLift: true # TODO: has bug
    useDiscreteVelocityLift: false
    useEquivariantOutput: true
    # useEquivariantOutput: false
    useFeaturePredictions: true
    # useFeaturePredictions: false
    # useMedianDepth: false
    useMedianDepth: true
    # Riccati variant: fast = per-sample; faster = batched per image sub-frame.
    riccatiVariant: faster
    imuBiasGroup: additive
  velocityNoise:
    acc: 0.012438843268295521
    accBias: 0.004462289865453429
    gyr: 0.000243153572917808
    gyrBias: 0.00013372703521098622
main:
  writeState: true
  cameraLag: 0.00
Rerun:
  # Per-entity toggles for --vis (all default true when omitted).
  # histeqImage: show the tracker's preprocessed (histogram-equalised) frame
  # in camera/image instead of the raw one.
  histeqImage: true
  # image: true
  # features: true
  # sparseImage: true
  # patchDepth: true
  # patchDepthCov: true
  # trajectory: true
  # groundtruth: true
  # landmarks: true
  # sparseWorld: true
  # cameraAxes: true
  # occupiedCells: true
  freeCells: false
SparseVog:
  # Per-feature Vogiatzis filter.
  # parametrization: euclidean, invdepth, polar (1D scalar)
  #                  invdepth3d, polar3d (3D static-anchor SOT(3) IEKF)
  #                  invdepth_additive3d (ρ-first additive inverse-depth EKF)
  # parametrization: invdepth_additive3d
  parametrization: bearing_invdepth_additive3d
  # max_pool_size: 1410
  # max_pool_size: 40
  max_pool_size: 300
  min_track_length: 5
  # conv_variance_threshold: 0.02 # var(z) gate for query()
  conv_variance_threshold: 2.0 # var(z) gate for query()
  # init_depth_var: 1.0
  init_depth_var: 10.0
  # sigma_pixel: 0.5              # pixel noise for obs tau^2 = z^4 * sigma^2 / drive^2
  sigma_pixel: 5.0              # pixel noise for obs tau^2 = z^4 * sigma^2 / drive^2
  uniform_z_max: 20.0           # outlier uniform density: 1/z_max
  # a_init: 10.0
  # b_init: 2.0
  a_init: 100000000.0
  b_init: 0.00000001
  ab_min: 1.0
  # ab_max: 20.0
  ab_max: 200.0
  min_inlier_ratio: 0.5         # gate for Mahalanobis stuck-outlier reset
  mahalanobis_reset_chi2: 0.2
  process_depth_var: 0.01       # fallback when P_vv unavailable
  min_parallax: 1.0e-4
  min_cos_sim: 0.95
  min_depth: 0.1
  max_depth: 150.0
  # PlaneDetector (separate instance, fed by sparse_vog pool)
  pd_max_tri_side_px: 200
  pd_max_dist_between_z: 0.1
  pd_max_norm_deg: 10
  pd_min_plane_features: 15
  vis_min_depth: 0.5
  vis_max_depth: 5.0
Stereo:
  # enabled: true
  enabled: false
  pyramid_levels: 3
  patch_half_size: 4
  max_iterations: 30
  n_search_candidates: 0
  knn_propagation: 5
  max_residual: 20.0
  histeq: global
  # histeq: clahe
PatchDepth:
  # per_patch_bearing: target-anchored per-patch tangent rectification (wide-FoV,
  # seamless). A/B against tiled_bearing by switching this line.
  camera_mode: per_patch_bearing
  # camera_mode: undistorted_pinhole
  # camera_mode: raw_distorted
  warp_mode: fast_translation
  # warp_mode: exact
  scale: 0.25
  patch_size: 8
  patch_stride: 4
  # GN early-exit: stop refining a patch once |Δη| (log-range step) drops below
  # this. Larger = fewer iterations (faster) but coarser depth; default 1e-3.
  gn_eta_convergence_tol: 0.001
  pose_angular_velocity_var: 0.0
  # tiled_tile_size: 96
  tiled_tile_size: 64
  tiled_tile_overlap: 4
  cell_size: 8
  seed_radius_px: 64
  min_baseline_ratio: 0.005
  max_baseline_ratio: 0.3
  n_pyramid_levels: 1
  max_depth: 150.0
  min_structure_eigen: 1.0
  max_structure_condition: 0.0
  vis_min_depth: 0.5
  vis_max_depth: 5.0
  n_search_candidates: 1
  cov_vis_min: 0.0
  cov_vis_max: 0.5
LocalOccupancy:
  enabled: true
  resolution: 0.10
  width_cells: 160
  height_cells: 160
  sample_stride: 4
  min_range: 0.25
  max_range: 12.0
  max_eta_std: 0.5
  # v1 uncertainty-aware update: σ_m = range·sqrt(var(η)) shapes the log-odds
  # (Gaussian occupied bump + confidence-weighted carve). Set to "fixed" for v0.
  update_mode: uncertainty_aware
  band_k: 2.0
  sigma_floor_factor: 0.5
  min_confidence_weight: 0.1
  min_obstacle_height: -1.0
  max_obstacle_height: 1.0
