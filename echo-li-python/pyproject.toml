[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "echo-li"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "scipy", "matplotlib"]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "echo_li._echo_li"
