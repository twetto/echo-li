RudolfV:
  equaliseImageHistogram: true
  # CLAHE gives better local contrast in dark / low-light VOXL2 scenes.
  # Matched to OpenVINS: cv::createCLAHE(10.0, cv::Size(8,8)).
  # OpenVINS 8×8 grid on 1280×800 → ~160px tiles; 128px is the closest
  # square-tile equivalent (10×7 grid, slightly finer).
  histeq: clahe
  clahe_tile_size: 128
  clahe_clip_limit: 10.0
  featureDist: 16.0
  featureSearchThreshold: 0.8
  # Lower threshold to pull more features from dark/noisy H.265 frames.
  fastThreshold: 40
  maxFeatures: 300
  maxLevel: 3
  lbpPolicy: SoftPenalty
  enableRansac: true

eqf:
  maxFeatures: 40
  initialValue:
    # sceneDepth: 3.0
    sceneDepth: 20.0
  initialVariance:
    attitude: 0.13565029126052572
    biasAcc: 1.5813333765300104
    biasGyr: 97162.79515771076
    cameraAttitude: 0.0010228558965517584
    cameraPosition: 0.023501400846134893
    point: 129.90415638150924
    position: 0.1
    velocity: 8.974852995731e-08
  measurementNoise:
    # Wider pixel noise for H.265 compression artefacts and dark-scene jitter
    # (matches OpenVINS sigma_px=4.0).  Now decoupled from the outlier gate.
    feature: 4.0
    # Outlier gate in pixels (was multiplied by sigma_bearing; now absolute).
    # 10px ≈ the old 5.0 * 2.0 default.
    featureOutlierAbs: 10.0
    featureOutlierProb: 0.03229809583062128
    featureRetention: 0.18594708334486176
  processVariance:
    attitude: 6.025875320811407e-05
    biasAcc: 0.0
    biasGyr: 0.0
    # Frozen — with inflated bias random walk the extrinsics should not drift;
    # any non-zero process noise here lets them absorb IMU errors and corrupts
    # triangulation geometry, collapsing landmark depths toward the camera.
    cameraAttitude: 0.0
    cameraPosition: 0.0
    point: 0.00029845436136043135
    position: 9.981466095928483e-06
    velocity: 0.025317333863551263
  settings:
    coordinateChoice: Normal
    fastRiccati: false
    useDiscreteInnovationLift: false
    useDiscreteVelocityLift: false
    useEquivariantOutput: true
    useFeaturePredictions: true
    useMedianDepth: true
    riccatiVariant: faster
    imuBiasGroup: additive
  velocityNoise:
    # ICM42688P — Allan variance baseline × empirical multipliers.
    # Baseline (2026-09-06, 2.13h static bag):
    #   gyr_N=1.663e-4  gyr_RRW=2.399e-5  acc_N=4.622e-4  acc_RRW=6.442e-5
    # Multipliers: gyr 2×, gyrBias 3×, acc 5×, accBias 20×
    # NOT principled — chosen to land near previously-working values.
    # Allan variance = static bench floor; real deployment adds vibration,
    # temperature drift, timing jitter.  Properly: prop-on Allan, or tune
    # against innovation whiteness, or grid-sweep vs MOCAP ground truth.
    acc: 2.31095e-03      # 4.622e-4 × 5   [m/s²/√Hz]
    accBias: 1.28842e-03  # 6.442e-5 × 20  [m/s³/√Hz]
    gyr: 3.32660e-04      # 1.663e-4 × 2   [rad/s/√Hz]
    gyrBias: 7.19700e-05  # 2.399e-5 × 3   [rad/s²/√Hz]

SparseVog:
  parametrization: bearing_invdepth_additive3d
  max_pool_size: 300
  min_track_length: 5
  conv_variance_threshold: 2.0
  init_depth_var: 10.0
  sigma_pixel: 5.0
  uniform_z_max: 20.0
  a_init: 100000000.0
  b_init: 0.00000001
  ab_min: 1.0
  ab_max: 200.0
  min_inlier_ratio: 0.5
  mahalanobis_reset_chi2: 0.2
  bias_walk_var: 0.0
  process_depth_var: 0.01
  pose_range_scale: 1.0
  pose_range_coherent: 0.0
  min_parallax: 0.0001
  min_cos_sim: 0.95
  min_depth: 0.1
  max_depth: 12.0

PatchDepth:
  # per_patch_bearing: target-anchored per-patch tangent rectification for the
  # equidistant fisheye.  Seamless and wide-FoV-correct.
  camera_mode: per_patch_bearing
  warp_mode: fast_translation
  # Quarter-resolution for speed on battery.
  scale: 0.25
  patch_size: 8
  patch_stride: 4
  gn_eta_convergence_tol: 0.001
  n_pyramid_levels: 1
  seed_radius_px: 64
  min_baseline_ratio: 0.005
  max_baseline_ratio: 0.3
  max_depth: 12.0
  # min_structure_eigen: 1.0
  min_structure_eigen: 0.0
  vis_min_depth: 0.3
  vis_max_depth: 8.0

DISDepth:
  # DIS optical flow preset: ultrafast / fast / medium.
  preset: medium
  # Assumed flow noise in pixels — drives depth uncertainty.
  sigma_flow_px: 1.0
  # Minimum sin²(parallax angle) for triangulation.
  min_parallax_sin2: 1.0e-5
  # Number of keyframes to keep for baseline selection.
  max_keyframes: 5

LocalOccupancy:
  enabled: true
  resolution: 0.10
  width_cells: 160
  height_cells: 160
  sample_stride: 4
  min_range: 0.25
  max_range: 12.0
  max_eta_std: 0.5
  update_mode: fixed
  min_obstacle_height: -1.0
  max_obstacle_height: 1.0

main:
  writeState: false
  # The ROS wrapper applies camera_time_offset_sec explicitly.
  cameraLag: 0.0
